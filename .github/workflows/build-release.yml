name: Build Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download WinDDK 2003 build tools
        shell: bash
        run: |
          mkdir -p ddk-tools
          cd ddk-tools
          git init
          git remote add origin https://github.com/9176324/WinDDK.git
          git config core.sparseCheckout true
          echo "3790.1830/bin/x86/*" >> .git/info/sparse-checkout
          echo "3790.1830/bin/makefile.def" >> .git/info/sparse-checkout
          echo "3790.1830/bin/makefile.plt" >> .git/info/sparse-checkout
          git fetch --depth=1 origin
          git checkout FETCH_HEAD

      - name: Build
        shell: bash
        run: |
          export PATH="$PWD/ddk-tools/3790.1830/bin/x86:$PATH"
          chmod +x build.sh
          ./build.sh

      - name: Package build
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          tar -czf winxp-build.tar.gz dist

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: winxp-build.tar.gz
